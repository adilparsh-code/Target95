name: Target95 Autonomous Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *' # 09:00 IST

permissions:
  contents: write
  pull-requests: write

jobs:
  autonomous-task:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate current data
        run: npm run validate:data

      - name: Run Claude Code agent
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Work on exactly ONE safe, high-priority unfinished Target95 development task.
            Inspect the repository before editing. Preserve the existing Next.js architecture.
            Do not change framework versions, authentication, deployment configuration, or delete major features.
            Prefer completing missing chapter/question data, fixing a clear bug, or making a small isolated improvement.
            Run `npm run validate:data` and `npm run build` after changes. Fix failures caused by your changes.
            Do not modify main directly. Create or use a task branch and open a pull request with a concise summary and tests performed.
            If no safe task can be identified, make no code changes and explain why.

      - name: Build check
        run: npm run build
