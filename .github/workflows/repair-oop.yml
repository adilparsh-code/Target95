name: One-time OOP data repair

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and sanitize OOP chapter
        run: python scripts/repair-oop.py

      - name: Validate repaired source
        run: |
          node --check src/app/data/question-bank/19-oop-concepts.js
          npm ci
          npm run validate:data

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/app/data/question-bank/19-oop-concepts.js
          git commit -m "fix: sanitize oop-concepts data [skip ci]" || echo "No changes to commit"
          git pull origin development --rebase
          git push origin development
