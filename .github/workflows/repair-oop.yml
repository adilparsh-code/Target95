name: One-time OOP data repair

on:
  push:
    branches: [development]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development
        uses: actions/checkout@v4

      - name: Fix quotes in OOP chapter
        run: |
          # Node script to properly escape quotes in the Java code strings
          node -e "
          const fs = require('fs');
          const file = 'src/app/data/question-bank/19-oop-concepts.js';
          let data = fs.readFileSync(file, 'utf8');
          
          // Unescaped quotes ko escape karega (e.g. \"A\" -> \\\"A\\\")
          data = data.replace(/println\s*\(\s*\"A\"\s*\)/g, 'println(\\\"A\\\")');
          data = data.replace(/println\s*\(\s*\"B\"\s*\)/g, 'println(\\\"B\\\")');
          
          fs.writeFileSync(file, data);
          "

      - name: Validate repaired source
        run: |
          node --check src/app/data/question-bank/19-oop-concepts.js
          npm ci

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-oop.yml
          git add src/app/data/question-bank/19-oop-concepts.js .github/workflows/repair-oop.yml
          git commit -m "fix: repair OOP chapter syntax [skip ci]" || echo "No changes to commit"
          git push origin development
