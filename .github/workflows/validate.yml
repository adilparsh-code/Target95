name: Target95 Validation

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify lockfile matches package manifest
        shell: bash
        run: |
          set -euo pipefail
          npm ci --dry-run --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline=false --ignore-scripts --no-audit --no-fund

      - name: Validate academic data
        id: validate_data
        shell: bash
        run: |
          set -o pipefail
          npm run validate:data 2>&1 | tee validate-output.txt

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target95-validation-report
          path: validate-output.txt
          if-no-files-found: ignore

      - name: Build application
        env:
          NODE_OPTIONS: --max-old-space-size=7168
        run: npm run build
