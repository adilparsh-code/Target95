name: Target95 Validation

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify lockfile matches package manifest
        shell: bash
        run: |
          set -euo pipefail
          npm ci --dry-run --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefer-offline=false --ignore-scripts --no-audit --no-fund

      - name: Validate academic data
        shell: bash
        run: npm run validate:data

      - name: Audit chapter content
        shell: bash
        run: npm run audit:chapters

      - name: Audit internal links
        shell: bash
        run: npm run audit:links

      - name: Build application
        env:
          NODE_OPTIONS: --max-old-space-size=7168
        run: npm run build

      - name: Unit tests
        run: npm test

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies (Firebase Web SDK for listener tests)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Firestore rules tests (local emulator only)
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-target95 "node --test --test-concurrency=1 test/firestore-rules-account-status.test.mjs test/firestore-listener-account-status.test.mjs"

