name: Web Engine Phase 1/2

on:
  push:
    branches:
      - feat/web-engine-foundation
      - feat/web-engine-internal-api
  pull_request:
    branches:
      - feat/content-engine-mocktest
      - feat/web-engine-foundation

permissions:
  contents: read

jobs:
  web-engine-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Web Engine tests
        run: npm run test:web-engine
      - name: Lint changed Web Engine files
        run: npm run lint -- src/app/api/search/route.js src/lib/web-engine/searchApi.mjs src/lib/web-engine/searchRateLimit.mjs test/web-engine-search-api.test.mjs test/web-engine-search-rate-limit.test.mjs
      - name: Run repository typecheck
        run: npm run typecheck
      - name: Build application
        env:
          NODE_OPTIONS: --max-old-space-size=7168
        run: npm run build
