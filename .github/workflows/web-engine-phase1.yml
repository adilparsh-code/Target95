name: Web Engine Phase 1

on:
  push:
    branches:
      - feat/web-engine-foundation
  pull_request:
    branches:
      - feat/content-engine-mocktest

permissions:
  contents: read

jobs:
  web-engine-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Web Engine unit tests
        run: npm run test:web-engine
