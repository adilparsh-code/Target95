name: Web Engine Phase 2

on:
  push:
    branches:
      - feat/web-engine-api
  pull_request:
    branches:
      - feat/web-engine-foundation

permissions:
  contents: read

jobs:
  web-engine-api-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Web Engine focused tests
        run: npm run test:web-engine
      - name: Run repository regression tests
        run: npm test
      - name: Run ESLint
        run: npm run lint
      - name: Run repository typecheck
        run: npm run typecheck
      - name: Build application
        env:
          NODE_OPTIONS: --max-old-space-size=7168
        run: npm run build
