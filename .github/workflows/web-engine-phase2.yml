name: Web Engine Phase 2

on:
  push:
    branches:
      - feat/web-engine-api
  pull_request:
    branches:
      - feat/web-engine-foundation

permissions:
  contents: read

jobs:
  web-engine-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Web Engine API tests
        run: node --test test/web-engine-search-api.test.mjs test/web-engine-search-contract.test.mjs test/web-engine-internal-search.test.mjs
