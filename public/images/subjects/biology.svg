<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Biology illustration: a cell, DNA helix and leaf">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
    <radialGradient id="cell" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fef9c3"/><stop offset="1" stop-color="#86efac"/></radialGradient>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <circle cx="560" cy="40" r="90" fill="#bbf7d0" opacity=".7"/>
  <circle cx="60" cy="300" r="110" fill="#6ee7b7" opacity=".5"/>
  <!-- cell -->
  <ellipse cx="200" cy="165" rx="125" ry="105" fill="url(#cell)" stroke="#15803d" stroke-width="6"/>
  <circle cx="190" cy="155" r="42" fill="#c4b5fd" stroke="#6d28d9" stroke-width="5"/>
  <circle cx="198" cy="150" r="14" fill="#6d28d9"/>
  <ellipse cx="275" cy="210" rx="26" ry="14" fill="#fdba74" stroke="#c2410c" stroke-width="4" transform="rotate(-25 275 210)"/>
  <ellipse cx="120" cy="215" rx="22" ry="12" fill="#fdba74" stroke="#c2410c" stroke-width="4" transform="rotate(20 120 215)"/>
  <circle cx="270" cy="115" r="9" fill="#38bdf8" stroke="#0369a1" stroke-width="3"/>
  <circle cx="125" cy="120" r="7" fill="#38bdf8" stroke="#0369a1" stroke-width="3"/>
  <!-- DNA -->
  <g fill="none" stroke-width="7" stroke-linecap="round">
    <path d="M400 40 C470 90 470 130 400 170 C330 210 330 250 400 290" stroke="#2563eb"/>
    <path d="M470 40 C400 90 400 130 470 170 C540 210 540 250 470 290" stroke="#db2777"/>
  </g>
  <g stroke="#475569" stroke-width="4" stroke-linecap="round">
    <line x1="418" y1="62" x2="452" y2="62"/><line x1="428" y1="100" x2="442" y2="100"/>
    <line x1="428" y1="140" x2="442" y2="140"/><line x1="418" y1="172" x2="452" y2="172"/>
    <line x1="428" y1="206" x2="442" y2="206"/><line x1="428" y1="244" x2="442" y2="244"/><line x1="418" y1="272" x2="452" y2="272"/>
  </g>
  <!-- leaf -->
  <path d="M520 290 C510 200 560 140 610 130 C620 190 590 260 520 290Z" fill="#22c55e" stroke="#166534" stroke-width="5"/>
  <path d="M520 290 C550 240 575 190 604 140" fill="none" stroke="#166534" stroke-width="4" stroke-linecap="round"/>
</svg>
