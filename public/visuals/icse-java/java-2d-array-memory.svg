<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Java Two-Dimensional Array Memory Model</title>
<desc id="desc">A 2D array is an array of references; the outer array holds references to separate row arrays elsewhere in memory.</desc>
<rect width="1200" height="560" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java 2D Array Memory Model</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="220" y="115" font-size="20" font-weight="700" fill="#0f172a">a (outer array of references)</text>
<rect x="120" y="130" width="200" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="220" y="167" font-size="18" fill="#1e3a8a">a[0]</text>
<rect x="120" y="190" width="200" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="220" y="227" font-size="18" fill="#1e3a8a">a[1]</text>
<rect x="120" y="250" width="200" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="220" y="287" font-size="18" fill="#1e3a8a">a[2]</text>

<path d="M320 160 L520 160" stroke="#334155" stroke-width="4"/>
<path d="M320 220 L520 350" stroke="#334155" stroke-width="4"/>
<path d="M320 280 L520 470" stroke="#334155" stroke-width="4"/>

<text x="680" y="140" font-size="18" font-weight="700" fill="#78350f">Row 0 (a[0])</text>
<rect x="520" y="150" width="90" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="565" y="180" font-size="16" fill="#78350f">7</text>
<rect x="610" y="150" width="90" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="655" y="180" font-size="16" fill="#78350f">2</text>
<rect x="700" y="150" width="90" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="745" y="180" font-size="16" fill="#78350f">9</text>

<text x="680" y="335" font-size="18" font-weight="700" fill="#78350f">Row 1 (a[1])</text>
<rect x="520" y="345" width="90" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="565" y="375" font-size="16" fill="#78350f">4</text>
<rect x="610" y="345" width="90" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="655" y="375" font-size="16" fill="#78350f">6</text>
<rect x="700" y="345" width="90" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="745" y="375" font-size="16" fill="#78350f">1</text>

<text x="680" y="455" font-size="18" font-weight="700" fill="#78350f">Row 2 (a[2])</text>
<rect x="520" y="465" width="90" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="565" y="495" font-size="16" fill="#78350f">3</text>
<rect x="610" y="465" width="90" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="655" y="495" font-size="16" fill="#78350f">5</text>
<rect x="700" y="465" width="90" height="50" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="745" y="495" font-size="16" fill="#78350f">8</text>

<text x="950" y="380" font-size="18" fill="#0f172a" text-anchor="start">a[1][2] = 1</text>
<text x="950" y="410" font-size="15" fill="#334155" text-anchor="start">(row 1, column 2)</text>
</g>
</svg>
