<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Two-Dimensional Array Traversal Order</title>
<desc id="desc">Nested loops visit a jagged-safe 2D array row by row: for each row i, every column j from 0 to a[i].length-1 is visited before moving to the next row.</desc>
<rect width="1200" height="420" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">2D Array Traversal Order</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="600" y="90" font-size="16" fill="#334155">int[][] a = &#123;&#123;1,2&#125;,&#123;3,4&#125;,&#123;5,6&#125;&#125;;  for(i) for(j) visits (i,j) in this order</text>
<rect x="420" y="130" width="82" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="461.0" y="165" font-size="22" fill="#0f172a" text-anchor="middle">1</text>
<text x="461.0" y="185" font-size="12" fill="#78350f" text-anchor="middle">visit #1: (0,0)</text>
<rect x="510" y="130" width="82" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="551.0" y="165" font-size="22" fill="#0f172a" text-anchor="middle">2</text>
<text x="551.0" y="185" font-size="12" fill="#78350f" text-anchor="middle">visit #2: (0,1)</text>
<rect x="420" y="200" width="82" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="461.0" y="235" font-size="22" fill="#0f172a" text-anchor="middle">3</text>
<text x="461.0" y="255" font-size="12" fill="#78350f" text-anchor="middle">visit #3: (1,0)</text>
<rect x="510" y="200" width="82" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="551.0" y="235" font-size="22" fill="#0f172a" text-anchor="middle">4</text>
<text x="551.0" y="255" font-size="12" fill="#78350f" text-anchor="middle">visit #4: (1,1)</text>
<rect x="420" y="270" width="82" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="461.0" y="305" font-size="22" fill="#0f172a" text-anchor="middle">5</text>
<text x="461.0" y="325" font-size="12" fill="#78350f" text-anchor="middle">visit #5: (2,0)</text>
<rect x="510" y="270" width="82" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="551.0" y="305" font-size="22" fill="#0f172a" text-anchor="middle">6</text>
<text x="551.0" y="325" font-size="12" fill="#78350f" text-anchor="middle">visit #6: (2,1)</text>
<text x="600" y="380" font-size="15" fill="#334155">Order visited: (0,0),(0,1),(1,0),(1,1),(2,0),(2,1) - the inner loop finishes each row before the outer loop advances.</text>
</g>
</svg>
