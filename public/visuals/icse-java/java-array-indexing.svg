<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Java One-Dimensional Array Indexing</title>
<desc id="desc">Five array cells containing sample values with zero-based indexes from 0 to 4. The last valid index is length minus one.</desc>
<rect width="1200" height="420" rx="28" fill="#f8fafc"/>
<text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Array Indexing</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="600" y="108" font-size="22" fill="#334155">int[] marks = {72, 85, 91, 64, 78};</text>
<g stroke="#2563eb" stroke-width="3">
<rect x="115" y="155" width="180" height="105" rx="12" fill="#dbeafe"/><rect x="315" y="155" width="180" height="105" rx="12" fill="#dbeafe"/><rect x="515" y="155" width="180" height="105" rx="12" fill="#dbeafe"/><rect x="715" y="155" width="180" height="105" rx="12" fill="#dbeafe"/><rect x="915" y="155" width="180" height="105" rx="12" fill="#dbeafe"/>
</g>
<text x="205" y="212" font-size="28" font-weight="700" fill="#1e3a8a">72</text><text x="405" y="212" font-size="28" font-weight="700" fill="#1e3a8a">85</text><text x="605" y="212" font-size="28" font-weight="700" fill="#1e3a8a">91</text><text x="805" y="212" font-size="28" font-weight="700" fill="#1e3a8a">64</text><text x="1005" y="212" font-size="28" font-weight="700" fill="#1e3a8a">78</text>
<text x="205" y="305" font-size="20" fill="#475569">index 0</text><text x="405" y="305" font-size="20" fill="#475569">index 1</text><text x="605" y="305" font-size="20" fill="#475569">index 2</text><text x="805" y="305" font-size="20" fill="#475569">index 3</text><text x="1005" y="305" font-size="20" fill="#475569">index 4</text>
<rect x="355" y="345" width="490" height="48" rx="16" fill="#e2e8f0"/><text x="600" y="377" font-size="20" font-weight="700" fill="#334155">5 elements → valid indexes 0 to 4 → last index = length − 1</text>
</g></svg>
