<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Java array traversal</title><desc id="desc">An array showing index movement from zero to the last valid index.</desc><rect width="1200" height="520" rx="32" fill="#f8fafc"/><text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Java 1D Array Traversal</text><text x="600" y="105" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">for (int i = 0; i &lt; a.length; i++)</text><g transform="translate(130 170)"><g font-family="Arial" text-anchor="middle" font-weight="700" font-size="22"><rect width="150" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="75" y="55" fill="#0f172a">72</text><text x="75" y="88" font-size="16" fill="#475569">index 0</text><rect x="150" width="150" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="225" y="55" fill="#0f172a">85</text><text x="225" y="88" font-size="16" fill="#475569">index 1</text><rect x="300" width="150" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="375" y="55" fill="#0f172a">91</text><text x="375" y="88" font-size="16" fill="#475569">index 2</text><rect x="450" width="150" height="100" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="525" y="55" fill="#0f172a">64</text><text x="525" y="88" font-size="16" fill="#475569">index 3</text><rect x="600" width="150" height="100" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="675" y="55" fill="#0f172a">78</text><text x="675" y="88" font-size="16" fill="#475569">index 4</text></g></g><path d="M170 330 H1030" stroke="#334155" stroke-width="5"/><path d="M170 330 v-22 M320 330 v-22 M470 330 v-22 M620 330 v-22 M770 330 v-22 M920 330 v-22" stroke="#334155" stroke-width="4"/><text x="600" y="385" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#15803d">Visit every valid index: 0 → 1 → 2 → 3 → 4</text><text x="600" y="430" text-anchor="middle" font-family="Arial" font-size="19" fill="#64748b">Stop when i becomes a.length.</text></svg>