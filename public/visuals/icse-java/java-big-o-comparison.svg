<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Big O Growth Comparison</title>
<desc id="desc">Common complexity classes ordered from fastest to slowest growth, each matched to a real algorithm example, from O(1) constant time up to O(2^n) exponential time.</desc>
<rect width="1200" height="500" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Big O Growth Comparison (fastest &#8594; slowest)</text>
<g font-family="Arial,sans-serif">
<rect x="140" y="95" width="60" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="180.0" y="123" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">O(1)</text>
<text x="240" y="123" font-size="15" fill="#334155">Array index, stack push/pop</text>
<rect x="140" y="157" width="110" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="205.0" y="185" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">O(log n)</text>
<text x="290" y="185" font-size="15" fill="#334155">Binary search, i *= 2 loop</text>
<rect x="140" y="219" width="170" height="42" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
<text x="235.0" y="247" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">O(n)</text>
<text x="350" y="247" font-size="15" fill="#334155">Linear search, single for-loop</text>
<rect x="140" y="281" width="250" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="160" y="309" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">O(n log n)</text>
<text x="430" y="309" font-size="15" fill="#334155">Merge sort, efficient sorting</text>
<rect x="140" y="343" width="350" height="42" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
<text x="160" y="371" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">O(n²)</text>
<text x="530" y="371" font-size="15" fill="#334155">Nested loops; bubble/selection sort</text>
<rect x="140" y="405" width="460" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text x="160" y="433" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">O(2ⁿ)</text>
<text x="640" y="433" font-size="15" fill="#334155">Naive recursive Fibonacci</text>
</g>
<text x="600" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">Bar width represents relative growth as input size n increases - keep the fastest-growing term, drop constants.</text>
</svg>
