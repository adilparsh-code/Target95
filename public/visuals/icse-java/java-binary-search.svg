<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Java Binary Search</title>
<desc id="desc">Binary search on a sorted array narrows the search range by comparing the middle element, discarding half the range each step.</desc>
<rect width="1200" height="560" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Binary Search</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="600" y="95" font-size="20" fill="#334155">Sorted array, search for target value 23</text>
<text x="80" y="160" font-size="16" fill="#334155" text-anchor="end">Step 1: low=0 high=8</text>
<rect x="90" y="140" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="137" y="175" font-size="20" fill="#0f172a" opacity="1">2</text>
<rect x="208" y="140" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="255" y="175" font-size="20" fill="#0f172a" opacity="1">5</text>
<rect x="326" y="140" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="373" y="175" font-size="20" fill="#0f172a" opacity="1">8</text>
<rect x="444" y="140" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="491" y="175" font-size="20" fill="#0f172a" opacity="1">12</text>
<rect x="562" y="140" width="95" height="55" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="3" opacity="1"/>
<text x="609" y="175" font-size="20" fill="#0f172a" opacity="1">16</text>
<rect x="680" y="140" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="727" y="175" font-size="20" fill="#0f172a" opacity="1">23</text>
<rect x="798" y="140" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="845" y="175" font-size="20" fill="#0f172a" opacity="1">29</text>
<rect x="916" y="140" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="963" y="175" font-size="20" fill="#0f172a" opacity="1">34</text>
<rect x="1034" y="140" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="1081" y="175" font-size="20" fill="#0f172a" opacity="1">41</text>
<text x="80" y="240" font-size="16" fill="#334155" text-anchor="end">Step 2: 23 &gt; 16, search right half</text>
<rect x="90" y="220" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="137" y="255" font-size="20" fill="#0f172a" opacity="0.4">2</text>
<rect x="208" y="220" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="255" y="255" font-size="20" fill="#0f172a" opacity="0.4">5</text>
<rect x="326" y="220" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="373" y="255" font-size="20" fill="#0f172a" opacity="0.4">8</text>
<rect x="444" y="220" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="491" y="255" font-size="20" fill="#0f172a" opacity="0.4">12</text>
<rect x="562" y="220" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="609" y="255" font-size="20" fill="#0f172a" opacity="0.4">16</text>
<rect x="680" y="220" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="727" y="255" font-size="20" fill="#0f172a" opacity="1">23</text>
<rect x="798" y="220" width="95" height="55" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="3" opacity="1"/>
