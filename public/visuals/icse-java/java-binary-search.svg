<rect x="916" y="220" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="963" y="255" font-size="20" fill="#0f172a" opacity="1">34</text>
<rect x="1034" y="220" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="1081" y="255" font-size="20" fill="#0f172a" opacity="1">41</text>
<text x="80" y="320" font-size="16" fill="#334155" text-anchor="end">Step 3: 23 &lt; 29, search left half</text>
<rect x="90" y="300" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="137" y="335" font-size="20" fill="#0f172a" opacity="0.4">2</text>
<rect x="208" y="300" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="255" y="335" font-size="20" fill="#0f172a" opacity="0.4">5</text>
<rect x="326" y="300" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="373" y="335" font-size="20" fill="#0f172a" opacity="0.4">8</text>
<rect x="444" y="300" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="491" y="335" font-size="20" fill="#0f172a" opacity="0.4">12</text>
<rect x="562" y="300" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="609" y="335" font-size="20" fill="#0f172a" opacity="0.4">16</text>
<rect x="680" y="300" width="95" height="55" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="3" opacity="1"/>
<text x="727" y="335" font-size="20" fill="#0f172a" opacity="1">23</text>
<rect x="798" y="300" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="845" y="335" font-size="20" fill="#0f172a" opacity="0.4">29</text>
<rect x="916" y="300" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="963" y="335" font-size="20" fill="#0f172a" opacity="0.4">34</text>
<rect x="1034" y="300" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="1081" y="335" font-size="20" fill="#0f172a" opacity="0.4">41</text>
<rect x="435" y="365" width="140" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="505" y="402" font-size="20" fill="#14532d">Found: 23</text>
<text x="600" y="460" font-size="16" fill="#334155">Each step compares the middle element and discards the half that cannot contain the target.</text>
</g>
</svg>
