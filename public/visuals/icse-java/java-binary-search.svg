<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Binary Search</title>
<desc id="desc">Binary search maintains low and high pointers on a sorted array, computes mid, and halves the search range each step by comparing the target to the middle element.</desc>
<rect width="1200" height="480" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">Binary Search</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="600" y="90" font-size="18" fill="#334155">Sorted array, search for target value 23</text>
<text x="80" y="150" font-size="15" fill="#334155" text-anchor="end">low=0 high=8 mid=4: arr[4]=16</text>
<rect x="90" y="130" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="137" y="165" font-size="20" fill="#0f172a" opacity="1">2</text>
<rect x="208" y="130" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="255" y="165" font-size="20" fill="#0f172a" opacity="1">5</text>
<rect x="326" y="130" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="373" y="165" font-size="20" fill="#0f172a" opacity="1">8</text>
<rect x="444" y="130" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="491" y="165" font-size="20" fill="#0f172a" opacity="1">12</text>
<rect x="562" y="130" width="95" height="55" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="3" opacity="1"/>
<text x="609" y="165" font-size="20" fill="#0f172a" opacity="1">16</text>
<rect x="680" y="130" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="727" y="165" font-size="20" fill="#0f172a" opacity="1">23</text>
<rect x="798" y="130" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="845" y="165" font-size="20" fill="#0f172a" opacity="1">29</text>
<rect x="916" y="130" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="963" y="165" font-size="20" fill="#0f172a" opacity="1">34</text>
<rect x="1034" y="130" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="1081" y="165" font-size="20" fill="#0f172a" opacity="1">41</text>
<text x="80" y="230" font-size="15" fill="#334155" text-anchor="end">16 &lt; 23, low=mid+1=5, mid=6: arr[6]=29</text>
<rect x="90" y="210" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="137" y="245" font-size="20" fill="#0f172a" opacity="0.4">2</text>
<rect x="208" y="210" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="255" y="245" font-size="20" fill="#0f172a" opacity="0.4">5</text>
<rect x="326" y="210" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="373" y="245" font-size="20" fill="#0f172a" opacity="0.4">8</text>
<rect x="444" y="210" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="491" y="245" font-size="20" fill="#0f172a" opacity="0.4">12</text>
<rect x="562" y="210" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="609" y="245" font-size="20" fill="#0f172a" opacity="0.4">16</text>
<rect x="680" y="210" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="727" y="245" font-size="20" fill="#0f172a" opacity="1">23</text>
<rect x="798" y="210" width="95" height="55" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="3" opacity="1"/>
<text x="845" y="245" font-size="20" fill="#0f172a" opacity="1">29</text>
<rect x="916" y="210" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="963" y="245" font-size="20" fill="#0f172a" opacity="1">34</text>
<rect x="1034" y="210" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3" opacity="1"/>
<text x="1081" y="245" font-size="20" fill="#0f172a" opacity="1">41</text>
<text x="80" y="310" font-size="15" fill="#334155" text-anchor="end">23 &lt; 29, high=mid-1=5, mid=5: arr[5]=23</text>
<rect x="90" y="290" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="137" y="325" font-size="20" fill="#0f172a" opacity="0.4">2</text>
<rect x="208" y="290" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="255" y="325" font-size="20" fill="#0f172a" opacity="0.4">5</text>
<rect x="326" y="290" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="373" y="325" font-size="20" fill="#0f172a" opacity="0.4">8</text>
<rect x="444" y="290" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="491" y="325" font-size="20" fill="#0f172a" opacity="0.4">12</text>
<rect x="562" y="290" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="609" y="325" font-size="20" fill="#0f172a" opacity="0.4">16</text>
<rect x="680" y="290" width="95" height="55" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="3" opacity="1"/>
<text x="727" y="325" font-size="20" fill="#0f172a" opacity="1">23</text>
<rect x="798" y="290" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="845" y="325" font-size="20" fill="#0f172a" opacity="0.4">29</text>
<rect x="916" y="290" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="963" y="325" font-size="20" fill="#0f172a" opacity="0.4">34</text>
<rect x="1034" y="290" width="95" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" opacity="0.4"/>
<text x="1081" y="325" font-size="20" fill="#0f172a" opacity="0.4">41</text>
<rect x="435" y="370" width="140" height="55" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="505" y="405" font-size="18" fill="#14532d">Match! return 5</text>
<text x="600" y="450" font-size="14" fill="#334155">mid = (low + high) / 2 each step; the half that cannot contain the target is discarded.</text>
</g>
</svg>
