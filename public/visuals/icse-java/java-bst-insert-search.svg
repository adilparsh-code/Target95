<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">BST Insert and Search: Compare-and-Descend</title>
<desc id="desc">Inserting 8, 3, 10, 1, 6 into an empty binary search tree, then tracing search(6) by comparing and descending left or right at each node.</desc>
<defs><marker id="bsh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="560" rx="32" fill="#f8fafc"/>
<text x="600" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#0f172a">BST Insert (8,3,10,1,6) and Search(6)</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<path d="M600 110 L400 210" stroke="#334155" stroke-width="4"/>
<path d="M600 110 L800 210" stroke="#334155" stroke-width="4"/>
<path d="M400 230 L300 320" stroke="#334155" stroke-width="4"/>
<path d="M400 230 L500 320" stroke="#334155" stroke-width="4"/>

<circle cx="600" cy="90" r="40" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="600" y="99" font-size="22" font-weight="700" fill="#1e3a8a">8</text>

<circle cx="400" cy="230" r="40" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="400" y="239" font-size="22" font-weight="700" fill="#78350f">3</text>

<circle cx="800" cy="230" r="40" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<text x="800" y="239" font-size="22" font-weight="700" fill="#0f172a">10</text>

<circle cx="300" cy="340" r="38" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<text x="300" y="349" font-size="20" fill="#0f172a">1</text>

<circle cx="500" cy="340" r="40" fill="#dcfce7" stroke="#16a34a" stroke-width="5"/>
<text x="500" y="349" font-size="22" font-weight="700" fill="#14532d">6</text>

<rect x="150" y="410" width="900" height="120" rx="14" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<text x="600" y="440" font-size="17" font-weight="700" fill="#0f172a">search(6): compare-and-descend</text>
<text x="600" y="468" font-size="15" fill="#334155">6 &lt; 8 &#8594; go left to 3</text>
<text x="600" y="492" font-size="15" fill="#334155">6 &gt; 3 &#8594; go right to 6</text>
<text x="600" y="516" font-size="15" fill="#14532d">6 == 6 &#8594; found (2 comparisons, since height h=2)</text>
</g>
</svg>
