<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Java Bubble Sort</title>
<desc id="desc">Bubble sort compares adjacent elements and swaps out-of-order pairs, moving the largest remaining value to the end each pass.</desc>
<rect width="1200" height="520" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Bubble Sort</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="150" y="138" font-size="16" fill="#334155" text-anchor="end">Unsorted array</text>
<rect x="420" y="100" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="462" y="138" font-size="22" fill="#0f172a">5</text>
<rect x="520" y="100" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="562" y="138" font-size="22" fill="#0f172a">2</text>
<rect x="620" y="100" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="662" y="138" font-size="22" fill="#0f172a">8</text>
<rect x="720" y="100" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="762" y="138" font-size="22" fill="#0f172a">1</text>
<rect x="820" y="100" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="862" y="138" font-size="22" fill="#0f172a">4</text>
<text x="150" y="238" font-size="16" fill="#334155" text-anchor="end">Pass 1: largest value (8) bubbles to the end</text>
<rect x="420" y="200" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="462" y="238" font-size="22" fill="#0f172a">2</text>
<rect x="520" y="200" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="562" y="238" font-size="22" fill="#0f172a">5</text>
<rect x="620" y="200" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="662" y="238" font-size="22" fill="#0f172a">1</text>
<rect x="720" y="200" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="762" y="238" font-size="22" fill="#0f172a">4</text>
<rect x="820" y="200" width="85" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="862" y="238" font-size="22" fill="#0f172a">8</text>
<text x="150" y="338" font-size="16" fill="#334155" text-anchor="end">Pass 2: next-largest (5) settles in place</text>
<rect x="420" y="300" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="462" y="338" font-size="22" fill="#0f172a">2</text>
<rect x="520" y="300" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="562" y="338" font-size="22" fill="#0f172a">1</text>
<rect x="620" y="300" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="662" y="338" font-size="22" fill="#0f172a">4</text>
<rect x="720" y="300" width="85" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="762" y="338" font-size="22" fill="#0f172a">5</text>
<rect x="820" y="300" width="85" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="862" y="338" font-size="22" fill="#0f172a">8</text>
<text x="150" y="438" font-size="16" fill="#334155" text-anchor="end">Fully sorted</text>
<rect x="420" y="400" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="462" y="438" font-size="22" fill="#0f172a">1</text>
<rect x="520" y="400" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="562" y="438" font-size="22" fill="#0f172a">2</text>
<rect x="620" y="400" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="662" y="438" font-size="22" fill="#0f172a">4</text>
<rect x="720" y="400" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="762" y="438" font-size="22" fill="#0f172a">5</text>
<rect x="820" y="400" width="85" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="862" y="438" font-size="22" fill="#0f172a">8</text>
<text x="600" y="500" font-size="16" fill="#334155">Each pass compares neighbouring elements and swaps them if the left one is larger.</text>
</g>
</svg>
