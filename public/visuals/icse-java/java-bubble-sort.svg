<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Bubble Sort: One Full Pass</title>
<desc id="desc">Tracing one full outer pass of bubble sort on [4,1,3,2]: compare each adjacent pair and swap if out of order, moving the largest value to the end.</desc>
<rect width="1200" height="460" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Bubble Sort: One Full Pass on [4, 1, 3, 2]</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="140" y="138" font-size="15" fill="#334155" text-anchor="end">Start</text>
<rect x="420" y="100" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="462" y="138" font-size="22" fill="#0f172a">4</text>
<rect x="520" y="100" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="562" y="138" font-size="22" fill="#0f172a">1</text>
<rect x="620" y="100" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="662" y="138" font-size="22" fill="#0f172a">3</text>
<rect x="720" y="100" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="762" y="138" font-size="22" fill="#0f172a">2</text>
<text x="140" y="218" font-size="15" fill="#334155" text-anchor="end">4 &gt; 1, swap &#8594; [1,4,3,2]</text>
<rect x="420" y="180" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="462" y="218" font-size="22" fill="#0f172a">1</text>
<rect x="520" y="180" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="562" y="218" font-size="22" fill="#0f172a">4</text>
<rect x="620" y="180" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="662" y="218" font-size="22" fill="#0f172a">3</text>
<rect x="720" y="180" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="762" y="218" font-size="22" fill="#0f172a">2</text>
<text x="140" y="298" font-size="15" fill="#334155" text-anchor="end">4 &gt; 3, swap &#8594; [1,3,4,2]</text>
<rect x="420" y="260" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="462" y="298" font-size="22" fill="#0f172a">1</text>
<rect x="520" y="260" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="562" y="298" font-size="22" fill="#0f172a">3</text>
<rect x="620" y="260" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="662" y="298" font-size="22" fill="#0f172a">4</text>
<rect x="720" y="260" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="762" y="298" font-size="22" fill="#0f172a">2</text>
<text x="140" y="378" font-size="15" fill="#334155" text-anchor="end">4 &gt; 2, swap &#8594; [1,3,2,4]</text>
<rect x="420" y="340" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="462" y="378" font-size="22" fill="#0f172a">1</text>
<rect x="520" y="340" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="562" y="378" font-size="22" fill="#0f172a">3</text>
<rect x="620" y="340" width="85" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="662" y="378" font-size="22" fill="#0f172a">2</text>
<rect x="720" y="340" width="85" height="55" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="762" y="378" font-size="22" fill="#0f172a">4</text>
<text x="600" y="430" font-size="15" fill="#334155">After pass 1, the largest value 4 has reached its correct final position at the end.</text>
</g>
</svg>
