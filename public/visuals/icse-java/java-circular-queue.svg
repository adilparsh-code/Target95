<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Circular Queue with Wrap-Around</title>
<desc id="desc">A circular queue of capacity 3 wraps rear and front using modulo arithmetic, so freed slots at the front are reused instead of being wasted like in a plain linear queue.</desc>
<rect width="1200" height="460" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Circular Queue with Wrap-Around (capacity 3)</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="200" y="100" font-size="16" font-weight="700" fill="#1e3a8a">After enqueue(A,B,C) - full</text>
<rect x="80" y="120" width="90" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="125" y="156" font-size="18">A</text><text x="125" y="105" font-size="12" fill="#334155" text-anchor="middle">idx 0</text>
<rect x="170" y="120" width="90" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="215" y="156" font-size="18">B</text><text x="215" y="105" font-size="12" fill="#334155" text-anchor="middle">idx 1</text>
<rect x="260" y="120" width="90" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="305" y="156" font-size="18">C</text><text x="305" y="105" font-size="12" fill="#334155" text-anchor="middle">idx 2</text>

<text x="600" y="100" font-size="16" font-weight="700" fill="#7f1d1d">After dequeue() removes A</text>
<rect x="480" y="120" width="90" height="60" fill="#fee2e2" stroke="#dc2626" stroke-width="3" stroke-dasharray="5,3"/><text x="525" y="156" font-size="14" fill="#7f1d1d">(freed)</text><text x="525" y="105" font-size="12" fill="#334155" text-anchor="middle">idx 0</text>
<rect x="570" y="120" width="90" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="615" y="156" font-size="18">B</text><text x="615" y="105" font-size="12" fill="#334155" text-anchor="middle">idx 1</text>
<rect x="660" y="120" width="90" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="705" y="156" font-size="18">C</text><text x="705" y="105" font-size="12" fill="#334155" text-anchor="middle">idx 2</text>

<text x="1000" y="100" font-size="16" font-weight="700" fill="#14532d">After enqueue(D): rear wraps to idx 0</text>
<rect x="880" y="120" width="90" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="925" y="156" font-size="18">D</text><text x="925" y="105" font-size="12" fill="#334155" text-anchor="middle">idx 0 (reused)</text>
<rect x="970" y="120" width="90" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="1015" y="156" font-size="18">B</text><text x="1015" y="105" font-size="12" fill="#334155" text-anchor="middle">idx 1</text>
<rect x="1060" y="120" width="90" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="1105" y="156" font-size="18">C</text><text x="1105" y="105" font-size="12" fill="#334155" text-anchor="middle">idx 2</text>

<rect x="300" y="250" width="600" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="600" y="285" font-size="16" font-family="monospace" fill="#78350f">rear = (rear + 1) % capacity;  front = (front + 1) % capacity;</text>
<text x="600" y="315" font-size="15" fill="#78350f">A size counter distinguishes "full" from "empty" (both could otherwise look like front==rear)</text>
</g>
<text x="600" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">FIFO order after these steps: B, C, D. A plain linear queue would never reuse index 0, causing false overflow.</text>
</svg>
