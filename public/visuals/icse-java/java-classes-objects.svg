<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Java Classes and Objects</title>
<desc id="desc">A class is a blueprint defining fields and methods. Objects are separate instances created from that class, each with its own copy of the instance data.</desc>
<rect width="1200" height="480" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Classes and Objects</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="450" y="90" width="300" height="140" rx="14" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
<text x="600" y="120" font-size="20" font-weight="700" fill="#0f172a">class Student</text>
<text x="600" y="150" font-size="15" fill="#334155">String name; int marks;</text>
<text x="600" y="175" font-size="15" fill="#334155">void display() { ... }</text>
<text x="600" y="205" font-size="13" fill="#64748b">(the blueprint)</text>

<path d="M550 230 L280 300" stroke="#334155" stroke-width="3"/>
<path d="M650 230 L920 300" stroke="#334155" stroke-width="3"/>

<rect x="120" y="300" width="320" height="130" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="280" y="330" font-size="18" font-weight="700" fill="#1e3a8a">Object: s1</text>
<text x="280" y="360" font-size="15" fill="#1e3a8a">name = "Ana"</text>
<text x="280" y="385" font-size="15" fill="#1e3a8a">marks = 91</text>

<rect x="760" y="300" width="320" height="130" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="920" y="330" font-size="18" font-weight="700" fill="#78350f">Object: s2</text>
<text x="920" y="360" font-size="15" fill="#78350f">name = "Ravi"</text>
<text x="920" y="385" font-size="15" fill="#78350f">marks = 78</text>

<text x="600" y="455" font-size="15" fill="#334155">Each object has its own copy of the instance fields, but shares the same class methods.</text>
</g>
</svg>
