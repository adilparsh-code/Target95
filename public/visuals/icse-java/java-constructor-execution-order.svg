<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Constructor Execution Order in Inheritance</title>
<desc id="desc">When a subclass object is created, the superclass constructor always runs to completion before the subclass constructor body executes.</desc>
<defs><marker id="ceh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="460" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Constructor Execution Order in Inheritance</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="600" y="95" font-size="16" fill="#334155">new B();  where class B extends A</text>

<rect x="150" y="130" width="900" height="70" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<text x="600" y="172" font-size="17" font-family="monospace" fill="#0f172a">new B() is called</text>

<path d="M600 200 L600 240" stroke="#334155" stroke-width="5" marker-end="url(#ceh)"/>

<rect x="150" y="240" width="420" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="360" y="270" font-size="18" font-weight="700" fill="#1e3a8a">1. A's constructor runs FIRST</text>
<text x="360" y="298" font-size="15" font-family="monospace" fill="#1e3a8a">prints "A"</text>

<path d="M570 280 L630 280" stroke="#334155" stroke-width="5" marker-end="url(#ceh)"/>

<rect x="630" y="240" width="420" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="840" y="270" font-size="18" font-weight="700" fill="#78350f">2. Then B's constructor runs</text>
<text x="840" y="298" font-size="15" font-family="monospace" fill="#78350f">prints "B"</text>

<rect x="350" y="360" width="500" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="600" y="402" font-size="18" fill="#14532d">Output: A then B</text>
</g>
<text x="600" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">Java automatically inserts a call to super() as the first statement of a subclass constructor if none is written.</text>
</svg>
