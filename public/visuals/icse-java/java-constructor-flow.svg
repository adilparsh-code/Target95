<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Java Constructor Flow</title>
<desc id="desc">The new keyword allocates memory for an object, then the matching constructor runs automatically to initialize its fields.</desc>
<defs><marker id="cfh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="460" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Constructor Flow</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="60" y="100" width="260" height="70" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
<text x="190" y="140" font-size="16" fill="#0f172a">Student s = new Student("Ana", 15);</text>

<path d="M320 135 L440 135" stroke="#334155" stroke-width="5" marker-end="url(#cfh)"/>
<text x="380" y="120" font-size="14" fill="#334155">1. allocate</text>

<rect x="440" y="100" width="220" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="550" y="140" font-size="17" fill="#1e3a8a">Memory reserved</text>
<text x="550" y="160" font-size="13" fill="#1e3a8a">for a Student object</text>

<path d="M660 135 L780 135" stroke="#334155" stroke-width="5" marker-end="url(#cfh)"/>
<text x="720" y="120" font-size="14" fill="#334155">2. init</text>

<rect x="780" y="100" width="360" height="130" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="960" y="130" font-size="18" font-weight="700" fill="#78350f">Constructor runs</text>
<text x="960" y="160" font-size="14" fill="#78350f">public Student(String n, int a) {</text>
<text x="960" y="182" font-size="14" fill="#78350f">  name = n; age = a;</text>
<text x="960" y="204" font-size="14" fill="#78350f">}</text>

<path d="M960 230 L960 280 L190 280 L190 240" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#cfh)"/>
<text x="600" y="300" font-size="14" fill="#334155">3. control returns to the caller; s now refers to a fully initialized object</text>

<rect x="60" y="340" width="260" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="190" y="370" font-size="15" fill="#14532d">s.name = "Ana"</text>
<text x="190" y="395" font-size="15" fill="#14532d">s.age = 15</text>
</g>
</svg>
