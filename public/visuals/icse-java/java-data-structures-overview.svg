<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Data Structures Overview</title>
<desc id="desc">A comparison of stack (LIFO), queue (FIFO), linked list, and binary tree, with their typical use case.</desc>
<rect width="1200" height="420" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">Choosing a Data Structure</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="60" y="100" width="260" height="180" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="190" y="135" font-size="19" font-weight="700" fill="#1e3a8a">Stack</text>
<text x="190" y="160" font-size="14" fill="#1e3a8a">LIFO</text>
<text x="190" y="195" font-size="13" fill="#334155">push O(1), pop O(1)</text>
<text x="190" y="240" font-size="13" fill="#334155">Use: undo, backtracking,</text>
<text x="190" y="258" font-size="13" fill="#334155">expression evaluation</text>

<rect x="330" y="100" width="260" height="180" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="460" y="135" font-size="19" font-weight="700" fill="#78350f">Queue</text>
<text x="460" y="160" font-size="14" fill="#78350f">FIFO</text>
<text x="460" y="195" font-size="13" fill="#334155">enqueue O(1), dequeue O(1)</text>
<text x="460" y="240" font-size="13" fill="#334155">Use: scheduling, BFS,</text>
<text x="460" y="258" font-size="13" fill="#334155">print spooling</text>

<rect x="600" y="100" width="260" height="180" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="730" y="135" font-size="19" font-weight="700" fill="#14532d">Linked List</text>
<text x="730" y="160" font-size="14" fill="#14532d">node + next pointer</text>
<text x="730" y="195" font-size="13" fill="#334155">insert head O(1), search O(n)</text>
<text x="730" y="240" font-size="13" fill="#334155">Use: dynamic-size</text>
<text x="730" y="258" font-size="13" fill="#334155">insertion / deletion</text>

<rect x="870" y="100" width="260" height="180" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="1000" y="135" font-size="19" font-weight="700" fill="#7f1d1d">Binary Tree</text>
<text x="1000" y="160" font-size="14" fill="#7f1d1d">hierarchical, &#8804; 2 children</text>
<text x="1000" y="195" font-size="13" fill="#334155">inorder/preorder/postorder</text>
<text x="1000" y="240" font-size="13" fill="#334155">Use: hierarchical search,</text>
<text x="1000" y="258" font-size="13" fill="#334155">sorted traversal</text>
</g>
<text x="600" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Pick the structure that matches the operations your problem needs most often.</text>
</svg>
