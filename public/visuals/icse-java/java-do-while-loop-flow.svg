<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Java Do-While Loop Execution Flow</title>
<desc id="desc">A do-while loop executes its body once before checking the condition, guaranteeing at least one execution.</desc>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="560" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java DO-WHILE Loop Execution Flow</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="470" y="95" width="260" height="60" rx="14" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
<text x="600" y="132" font-size="18" fill="#0f172a">Start / initialize</text>
<path d="M600 155 L600 195" stroke="#334155" stroke-width="5" marker-end="url(#ah)"/>

<rect x="450" y="195" width="300" height="70" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="600" y="238" font-size="18" fill="#14532d">Execute loop body FIRST</text>

<path d="M600 265 L600 305" stroke="#334155" stroke-width="5" marker-end="url(#ah)"/>
<path d="M600 305 L740 375 L600 445 L460 375 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
<text x="600" y="370" font-size="20" font-weight="700" fill="#1e3a8a">Condition</text>
<text x="600" y="393" font-size="16" fill="#1e3a8a">checked AFTER</text>

<path d="M460 375 L280 375 L280 230 L450 230" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#ah)"/>
<text x="330" y="215" font-size="16" fill="#166534">true: repeat</text>

<path d="M740 375 L920 375" stroke="#334155" stroke-width="5" marker-end="url(#ah)"/>
<text x="820" y="358" font-size="16" fill="#7f1d1d">false</text>
<rect x="920" y="340" width="220" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="1030" y="382" font-size="18" fill="#7f1d1d">Exit loop</text>
</g>
</svg>
