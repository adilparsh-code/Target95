<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Java Encapsulation Flow</title>
<desc id="desc">Educational diagram showing private data protected inside a class and accessed through public getter and setter methods.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="520" rx="30" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Encapsulation: Controlled Access</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="90" y="150" width="260" height="160" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="220" y="195" font-size="26" font-weight="700" fill="#1e3a8a">Outside Code</text><text x="220" y="235" font-size="19" fill="#334155">object.setAge(16)</text><text x="220" y="275" font-size="19" fill="#334155">object.getAge()</text>
<line x1="350" y1="230" x2="470" y2="230" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="470" y="110" width="320" height="240" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="630" y="150" font-size="26" font-weight="700" fill="#5b21b6">Class Person</text><rect x="535" y="180" width="190" height="70" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="630" y="223" font-size="22" font-weight="700" fill="#4c1d95">private age</text><text x="630" y="285" font-size="18" fill="#475569">Data is hidden from direct</text><text x="630" y="310" font-size="18" fill="#475569">external access</text>
<line x1="790" y1="230" x2="910" y2="230" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="910" y="150" width="210" height="160" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1015" y="195" font-size="25" font-weight="700" fill="#166534">Public Methods</text><text x="1015" y="235" font-size="18" fill="#334155">getAge()</text><text x="1015" y="270" font-size="18" fill="#334155">setAge()</text>
<rect x="300" y="395" width="600" height="65" rx="18" fill="#e2e8f0"/><text x="600" y="436" font-size="21" font-weight="700" fill="#334155">Encapsulation = data hiding + controlled access</text>
</g></svg>
