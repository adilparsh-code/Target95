th="5" marker-end="url(#a)"/><rect x="485" y="630" width="230" height="45" rx="14" fill="#e2e8f0"/><text x="600" y="660" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#334155">continue program</text></svg>