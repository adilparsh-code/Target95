<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Java Inheritance Hierarchy</title>
<desc id="desc">A simple class hierarchy showing Person as parent, Student as child, and Topper as a further subclass.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="500" rx="30" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Inheritance Hierarchy</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="445" y="100" width="310" height="100" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="600" y="142" font-size="26" font-weight="700" fill="#1e3a8a">Person</text><text x="600" y="173" font-size="19" fill="#334155">name, age</text>
<line x1="600" y1="200" x2="600" y2="275" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="445" y="275" width="310" height="100" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="600" y="317" font-size="26" font-weight="700" fill="#166534">Student</text><text x="600" y="348" font-size="19" fill="#334155">rollNo, marks + inherited members</text>
<line x1="600" y1="375" x2="600" y2="430" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="445" y="430" width="310" height="55" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="600" y="465" font-size="24" font-weight="700" fill="#5b21b6">Topper → rank</text>
<text x="940" y="150" font-size="22" font-weight="700" fill="#0f172a">extends</text><text x="940" y="185" font-size="18" fill="#475569">creates an IS-A relationship</text>
</g></svg>
