<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Java Linear Search</title>
<desc id="desc">Linear search checks each array element in order from index 0 until the target value 9 is found at index 4.</desc>
<rect width="1200" height="460" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Linear Search</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="600" y="100" font-size="20" fill="#334155">Search for target value 9</text>
<rect x="150" y="160" width="160" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="230" y="215" font-size="30" font-weight="700" fill="#0f172a">4</text>
<text x="230" y="270" font-size="16" fill="#334155">index 0</text>
<text x="230" y="300" font-size="14" fill="#7f1d1d">checked, no match</text>
<rect x="370" y="160" width="160" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="450" y="215" font-size="30" font-weight="700" fill="#0f172a">7</text>
<text x="450" y="270" font-size="16" fill="#334155">index 1</text>
<text x="450" y="300" font-size="14" fill="#7f1d1d">checked, no match</text>
<rect x="590" y="160" width="160" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="670" y="215" font-size="30" font-weight="700" fill="#0f172a">2</text>
<text x="670" y="270" font-size="16" fill="#334155">index 2</text>
<text x="670" y="300" font-size="14" fill="#7f1d1d">checked, no match</text>
<rect x="810" y="160" width="160" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="890" y="215" font-size="30" font-weight="700" fill="#0f172a">5</text>
<text x="890" y="270" font-size="16" fill="#334155">index 3</text>
<text x="890" y="300" font-size="14" fill="#7f1d1d">checked, no match</text>
<rect x="1030" y="160" width="160" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="1110" y="215" font-size="30" font-weight="700" fill="#0f172a">9</text>
<text x="1110" y="270" font-size="16" fill="#334155">index 4</text>
<text x="1110" y="300" font-size="14" fill="#166534">found!</text>
<path d="M230 145 L230 155 M450 145 L450 155" stroke="#334155"/>
<text x="600" y="400" font-size="16" fill="#334155">Linear search scans from index 0 onward and stops as soon as it finds a match.</text>
</g>
</svg>
