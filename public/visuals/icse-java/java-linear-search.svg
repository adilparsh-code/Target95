<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Linear Search</title>
<desc id="desc">Linear search checks each array element in order from index 0 until it finds a match or reaches the end. This exact array and target match the page's own linearSearch() code.</desc>
<rect width="1200" height="400" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">Linear Search</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="600" y="95" font-size="16" fill="#334155">linearSearch(arr, 9) on arr = &#123;4, 7, 2, 5, 9&#125;</text>
<rect x="150" y="150" width="160" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="230" y="205" font-size="30" font-weight="700" fill="#0f172a">4</text>
<text x="230" y="260" font-size="16" fill="#334155">arr[0]</text>
<text x="230" y="285" font-size="13" fill="#7f1d1d">no match</text>
<rect x="370" y="150" width="160" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="450" y="205" font-size="30" font-weight="700" fill="#0f172a">7</text>
<text x="450" y="260" font-size="16" fill="#334155">arr[1]</text>
<text x="450" y="285" font-size="13" fill="#7f1d1d">no match</text>
<rect x="590" y="150" width="160" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="670" y="205" font-size="30" font-weight="700" fill="#0f172a">2</text>
<text x="670" y="260" font-size="16" fill="#334155">arr[2]</text>
<text x="670" y="285" font-size="13" fill="#7f1d1d">no match</text>
<rect x="810" y="150" width="160" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="890" y="205" font-size="30" font-weight="700" fill="#0f172a">5</text>
<text x="890" y="260" font-size="16" fill="#334155">arr[3]</text>
<text x="890" y="285" font-size="13" fill="#7f1d1d">no match</text>
<rect x="1030" y="150" width="160" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="1110" y="205" font-size="30" font-weight="700" fill="#0f172a">9</text>
<text x="1110" y="260" font-size="16" fill="#334155">arr[4]</text>
<text x="1110" y="285" font-size="13" fill="#166534">arr[i]==key: return i</text>
<text x="600" y="365" font-size="15" fill="#334155">for (int i = 0; i &lt; arr.length; i++) if (arr[i] == key) return i;  &#8594; returns 4</text>
</g>
</svg>
