<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Java Loop Execution Flow</title>
<desc id="desc">Educational comparison of for, while and do-while loops, highlighting condition placement and first execution.</desc>
<rect width="1200" height="620" rx="30" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Loop Execution</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="80" y="100" width="320" height="220" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="240" y="140" font-size="26" font-weight="700" fill="#1e3a8a">for / while</text><text x="240" y="180" font-size="20" fill="#334155">1. Check condition</text><text x="240" y="220" font-size="20" fill="#334155">2. Execute body</text><text x="240" y="260" font-size="20" fill="#334155">3. Repeat</text><text x="240" y="300" font-size="18" font-weight="700" fill="#475569">Entry-controlled</text>
<rect x="440" y="100" width="320" height="220" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="600" y="140" font-size="26" font-weight="700" fill="#166534">do-while</text><text x="600" y="180" font-size="20" fill="#334155">1. Execute body</text><text x="600" y="220" font-size="20" fill="#334155">2. Check condition</text><text x="600" y="260" font-size="20" fill="#334155">3. Repeat if true</text><text x="600" y="300" font-size="18" font-weight="700" fill="#475569">Exit-controlled</text>
<rect x="800" y="100" width="320" height="220" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="960" y="140" font-size="26" font-weight="700" fill="#92400e">Exam Tip</text><text x="960" y="185" font-size="19" fill="#334155">do-while runs at least once</text><text x="960" y="225" font-size="19" fill="#334155">even when its condition</text><text x="960" y="255" font-size="19" fill="#334155">is initially false.</text>
<rect x="180" y="390" width="840" height="120" rx="22" fill="#e2e8f0"/><text x="600" y="435" font-size="22" font-weight="700" fill="#334155">Loop control: initialization → condition → body → update</text><text x="600" y="475" font-size="19" fill="#475569">Use break to leave the loop; use continue to skip to the next iteration.</text>
</g></svg>
