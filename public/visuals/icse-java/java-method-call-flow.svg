<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Java Method Call Flow</title>
<desc id="desc">Calling a method pauses the caller, transfers control to the method with its arguments, executes the method body, then returns a value and control to the caller.</desc>
<defs><marker id="mh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="460" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Method Call Flow</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="80" y="120" width="340" height="220" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="250" y="155" font-size="20" font-weight="700" fill="#1e3a8a">main()</text>
<text x="250" y="195" font-size="16" fill="#0f172a">int r = square(5);</text>
<text x="250" y="225" font-size="14" fill="#334155">1. pause here</text>
<text x="250" y="255" font-size="14" fill="#334155">4. resume with result</text>
<text x="250" y="285" font-size="14" fill="#334155">r now holds 25</text>

<path d="M420 190 L780 190" stroke="#334155" stroke-width="5" marker-end="url(#mh)"/>
<text x="600" y="175" font-size="15" fill="#334155">2. call with argument 5</text>

<rect x="780" y="120" width="340" height="220" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="950" y="155" font-size="20" font-weight="700" fill="#78350f">square(int n)</text>
<text x="950" y="195" font-size="16" fill="#0f172a">return n * n;</text>
<text x="950" y="230" font-size="14" fill="#334155">n = 5, computes 25</text>

<path d="M780 260 L420 260" stroke="#334155" stroke-width="5" marker-end="url(#mh)"/>
<text x="600" y="245" font-size="15" fill="#334155">3. return value 25</text>
</g>
</svg>
