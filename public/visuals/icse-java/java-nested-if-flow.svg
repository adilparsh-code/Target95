<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Java Nested If Decision Flow</title>
<desc id="desc">An outer if condition branches to a true path containing a second, inner if-else condition, and a false path that skips it.</desc>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="700" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Nested If Decision Flow</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<path d="M600 90 L600 140" stroke="#334155" stroke-width="5" marker-end="url(#ah)"/>
<path d="M600 140 L740 220 L600 300 L460 220 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
<text x="600" y="215" font-size="22" font-weight="700" fill="#1e3a8a">Outer condition</text>
<text x="600" y="240" font-size="18" fill="#1e3a8a">true?</text>

<path d="M600 300 L600 340" stroke="#334155" stroke-width="5" marker-end="url(#ah)"/>
<text x="640" y="325" font-size="18" fill="#166534" text-anchor="start">true</text>
<path d="M600 340 L730 415 L600 490 L470 415 Z" fill="#fef3c7" stroke="#d97706" stroke-width="5"/>
<text x="600" y="410" font-size="20" font-weight="700" fill="#78350f">Inner condition</text>
<text x="600" y="433" font-size="16" fill="#78350f">(nested if)</text>

<path d="M600 490 L600 530" stroke="#334155" stroke-width="5" marker-end="url(#ah)"/>
<rect x="480" y="530" width="240" height="70" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="600" y="572" font-size="18" fill="#14532d">Inner true branch</text>

<path d="M730 415 L850 415" stroke="#334155" stroke-width="5" marker-end="url(#ah)"/>
<text x="790" y="400" font-size="16" fill="#7f1d1d">false</text>
<rect x="850" y="380" width="240" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="970" y="422" font-size="18" fill="#7f1d1d">Inner false branch</text>

<path d="M460 220 L200 220" stroke="#334155" stroke-width="5" marker-end="url(#ah)"/>
<text x="330" y="205" font-size="18" fill="#7f1d1d">false</text>
<rect x="60" y="185" width="260" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="190" y="227" font-size="18" fill="#7f1d1d">Skip outer block</text>

<path d="M600 600 L600 640" stroke="#334155" stroke-width="4"/>
<path d="M970 450 L970 640 L620 640" stroke="#334155" stroke-width="4" fill="none"/>
<path d="M190 255 L190 660 L590 660" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#ah)"/>
<path d="M620 640 L620 660" stroke="#334155" stroke-width="4" marker-end="url(#ah)"/>
<rect x="450" y="655" width="300" height="24" fill="none"/>
<text x="600" y="672" font-size="16" fill="#334155">continues after the nested if-else block</text>
</g>
</svg>
