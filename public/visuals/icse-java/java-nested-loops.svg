<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Java Nested Loops</title>
<desc id="desc">An outer loop runs three times; the inner loop runs completely for each outer iteration, giving nine total inner executions.</desc>
<rect width="1200" height="620" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Nested Loops</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="90" y="100" width="1020" height="470" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
<text x="600" y="140" font-size="22" font-weight="700" fill="#1e3a8a">Outer loop: for (i = 0; i &lt; 3; i++)</text>

<rect x="150" y="175" width="900" height="120" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="600" y="205" font-size="18" font-weight="700" fill="#78350f">i = 0 &#8594; inner loop: for (j = 0; j &lt; 3; j++)</text>
<text x="230" y="255" font-size="16" fill="#78350f">j=0</text><text x="500" y="255" font-size="16" fill="#78350f">j=1</text><text x="780" y="255" font-size="16" fill="#78350f">j=2</text>
<rect x="180" y="225" width="120" height="50" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
<rect x="450" y="225" width="120" height="50" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
<rect x="730" y="225" width="120" height="50" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>

<rect x="150" y="310" width="900" height="120" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="600" y="340" font-size="18" font-weight="700" fill="#78350f">i = 1 &#8594; inner loop: for (j = 0; j &lt; 3; j++)</text>
<rect x="180" y="360" width="120" height="50" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
<rect x="450" y="360" width="120" height="50" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
<rect x="730" y="360" width="120" height="50" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>

<rect x="150" y="445" width="900" height="120" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="600" y="475" font-size="18" font-weight="700" fill="#78350f">i = 2 &#8594; inner loop: for (j = 0; j &lt; 3; j++)</text>
<rect x="180" y="495" width="120" height="50" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
<rect x="450" y="495" width="120" height="50" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
<rect x="730" y="495" width="120" height="50" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
</g>
<text x="600" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">The inner loop body runs 3 x 3 = 9 times in total.</text>
</svg>
