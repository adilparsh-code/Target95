<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Passing Objects by Reference-Value</title>
<desc id="desc">A method parameter receives a copy of the object reference, not a copy of the object. Changing a field through that reference is visible to the caller, but reassigning the parameter itself is not.</desc>
<defs><marker id="orh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="520" rx="32" fill="#f8fafc"/>
<text x="600" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Passing Objects by Reference-Value</text>
<g font-family="Arial,sans-serif">
<text x="60" y="90" font-size="17" font-weight="700" fill="#1e3a8a">Works: changing a FIELD through the reference</text>
<text x="60" y="115" font-size="14" font-family="monospace" fill="#334155">void raise(Student s) { s.marks += 5; }  called as raise(a);</text>
<rect x="60" y="135" width="140" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="130" y="170" text-anchor="middle" font-size="15" fill="#1e3a8a">caller: a</text>
<path d="M200 165 L340 165" stroke="#334155" stroke-width="3" marker-end="url(#orh)"/>
<rect x="340" y="135" width="140" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="410" y="170" text-anchor="middle" font-size="15" fill="#1e3a8a">param: s (copy)</text>
<path d="M270 200 L270 235" stroke="#16a34a" stroke-width="3" stroke-dasharray="4,3"/>
<path d="M410 200 L410 235" stroke="#16a34a" stroke-width="3" stroke-dasharray="4,3"/>
<rect x="210" y="235" width="320" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="370" y="270" text-anchor="middle" font-size="15" fill="#14532d">same Student object (marks now +5)</text>
<text x="370" y="320" text-anchor="middle" font-size="14" fill="#14532d">a.marks sees the change after the call returns</text>

<text x="700" y="90" font-size="17" font-weight="700" fill="#7f1d1d">Fails: reassigning the parameter variable</text>
<text x="700" y="115" font-size="14" font-family="monospace" fill="#334155">void swap(Student a, Student b) { Student t=a; a=b; b=t; }</text>
<rect x="700" y="135" width="140" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text x="770" y="170" text-anchor="middle" font-size="15" fill="#7f1d1d">caller: s1, s2</text>
<path d="M840 165 L960 165" stroke="#334155" stroke-width="3" stroke-dasharray="4,3"/>
<text x="900" y="150" text-anchor="middle" font-size="13" fill="#7f1d1d">unaffected</text>
<rect x="960" y="135" width="180" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text x="1050" y="170" text-anchor="middle" font-size="15" fill="#7f1d1d">local copies a,b swap</text>
<rect x="740" y="235" width="380" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="930" y="265" text-anchor="middle" font-size="15" fill="#7f1d1d">only the copies inside swap() exchange</text>
<text x="930" y="290" text-anchor="middle" font-size="15" fill="#7f1d1d">s1 and s2 in main are unchanged</text>
</g>
<text x="600" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">The reference itself is passed by value: the method gets its own copy of the address, not the caller's variable.</text>
</svg>
