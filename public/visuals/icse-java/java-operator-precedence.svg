<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Java Operator Precedence</title>
<desc id="desc">Operators evaluated from highest to lowest precedence: parentheses, unary, multiplicative, additive, relational, logical, then assignment.</desc>
<rect width="1200" height="480" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Operator Precedence (high &#8594; low)</text>
<g font-family="Arial,sans-serif">
<rect x="150" y="95" width="900" height="34" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
<text x="180" y="118" font-size="15" fill="#1e3a8a" font-weight="700">1</text>
<text x="230" y="118" font-size="16" fill="#0f172a" font-family="monospace">( )</text>
<text x="700" y="118" font-size="15" fill="#334155">Parentheses</text>
<rect x="150" y="131" width="900" height="34" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/>
<text x="180" y="154" font-size="15" fill="#1e3a8a" font-weight="700">2</text>
<text x="230" y="154" font-size="16" fill="#0f172a" font-family="monospace">++  --  (unary -)  !</text>
<text x="700" y="154" font-size="15" fill="#334155">Unary operators</text>
<rect x="150" y="167" width="900" height="34" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
<text x="180" y="190" font-size="15" fill="#1e3a8a" font-weight="700">3</text>
<text x="230" y="190" font-size="16" fill="#0f172a" font-family="monospace">*  /  %</text>
<text x="700" y="190" font-size="15" fill="#334155">Multiplicative</text>
<rect x="150" y="203" width="900" height="34" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/>
<text x="180" y="226" font-size="15" fill="#1e3a8a" font-weight="700">4</text>
<text x="230" y="226" font-size="16" fill="#0f172a" font-family="monospace">+  -</text>
<text x="700" y="226" font-size="15" fill="#334155">Additive</text>
<rect x="150" y="239" width="900" height="34" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
<text x="180" y="262" font-size="15" fill="#1e3a8a" font-weight="700">5</text>
<text x="230" y="262" font-size="16" fill="#0f172a" font-family="monospace">&lt;  &lt;=  &gt;  &gt;=</text>
<text x="700" y="262" font-size="15" fill="#334155">Relational</text>
<rect x="150" y="275" width="900" height="34" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/>
<text x="180" y="298" font-size="15" fill="#1e3a8a" font-weight="700">6</text>
<text x="230" y="298" font-size="16" fill="#0f172a" font-family="monospace">==  !=</text>
<text x="700" y="298" font-size="15" fill="#334155">Equality</text>
<rect x="150" y="311" width="900" height="34" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
<text x="180" y="334" font-size="15" fill="#1e3a8a" font-weight="700">7</text>
<text x="230" y="334" font-size="16" fill="#0f172a" font-family="monospace">&amp;&amp;</text>
<text x="700" y="334" font-size="15" fill="#334155">Logical AND</text>
<rect x="150" y="347" width="900" height="34" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/>
<text x="180" y="370" font-size="15" fill="#1e3a8a" font-weight="700">8</text>
<text x="230" y="370" font-size="16" fill="#0f172a" font-family="monospace">||</text>
<text x="700" y="370" font-size="15" fill="#334155">Logical OR</text>
<rect x="150" y="383" width="900" height="34" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
<text x="180" y="406" font-size="15" fill="#1e3a8a" font-weight="700">9</text>
<text x="230" y="406" font-size="16" fill="#0f172a" font-family="monospace">?:</text>
<text x="700" y="406" font-size="15" fill="#334155">Ternary</text>
<rect x="150" y="419" width="900" height="34" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/>
<text x="180" y="442" font-size="15" fill="#1e3a8a" font-weight="700">10</text>
<text x="230" y="442" font-size="16" fill="#0f172a" font-family="monospace">=  +=  -=  *=  /=</text>
<text x="700" y="442" font-size="15" fill="#334155">Assignment</text>
</g>
<text x="600" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Example: 2 + 3 * 4 evaluates as 2 + (3 * 4) = 14, since * has higher precedence than +.</text>
</svg>
