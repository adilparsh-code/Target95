<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Java Operator Categories</title>
<desc id="desc">Java operators grouped into arithmetic, relational, logical and assignment categories with an example of each.</desc>
<rect width="1200" height="480" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Operator Categories</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="70" y="100" width="260" height="150" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="200" y="135" font-size="20" font-weight="700" fill="#1e3a8a">Arithmetic</text>
<text x="200" y="165" font-size="16" fill="#0f172a">+  -  *  /  %</text>
<text x="200" y="200" font-size="14" fill="#334155">int c = a + b;</text>

<rect x="360" y="100" width="260" height="150" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="490" y="135" font-size="20" font-weight="700" fill="#78350f">Relational</text>
<text x="490" y="165" font-size="16" fill="#0f172a">==  !=  &gt;  &lt;  &gt;=  &lt;=</text>
<text x="490" y="200" font-size="14" fill="#334155">if (a &gt; b) ...</text>

<rect x="650" y="100" width="260" height="150" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="780" y="135" font-size="20" font-weight="700" fill="#14532d">Logical</text>
<text x="780" y="165" font-size="16" fill="#0f172a">&amp;&amp;   ||   !</text>
<text x="780" y="200" font-size="14" fill="#334155">if (a &gt; 0 &amp;&amp; b &gt; 0)</text>

<rect x="940" y="100" width="220" height="150" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="1050" y="135" font-size="20" font-weight="700" fill="#7f1d1d">Assignment</text>
<text x="1050" y="165" font-size="16" fill="#0f172a">=  +=  -=  *=  /=</text>
<text x="1050" y="200" font-size="14" fill="#334155">a += 5;</text>

<rect x="250" y="300" width="700" height="130" rx="14" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
<text x="600" y="335" font-size="18" font-weight="700" fill="#0f172a">Also: unary (++, --, unary -), ternary (?:), and bitwise (&amp;, |, ^, ~, &lt;&lt;, &gt;&gt;)</text>
<text x="600" y="375" font-size="15" fill="#334155">int max = (a &gt; b) ? a : b;   // ternary operator example</text>
</g>
</svg>
