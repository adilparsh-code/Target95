<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Java Platform Stack: JDK, JRE and JVM</title>
<desc id="desc">Educational diagram showing Java source code compiled into bytecode and executed by the JVM inside the JRE and JDK ecosystem.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="700" rx="32" fill="#f8fafc"/>
<text x="600" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">How Java Code Runs</text>
<rect x="90" y="130" width="250" height="130" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="215" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">Source Code</text>
<text x="215" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#334155">Hello.java</text>
<line x1="340" y1="195" x2="450" y2="195" stroke="#334155" stroke-width="5" marker-end="url(#a)"/>
<rect x="450" y="130" width="250" height="130" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="575" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#166534">Compiler</text>
<text x="575" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#334155">javac</text>
<line x1="700" y1="195" x2="810" y2="195" stroke="#334155" stroke-width="5" marker-end="url(#a)"/>
<rect x="810" y="130" width="250" height="130" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="935" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#92400e">Bytecode</text>
<text x="935" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#334155">Hello.class</text>
<line x1="935" y1="260" x2="935" y2="345" stroke="#334155" stroke-width="5" marker-end="url(#a)"/>
<rect x="300" y="345" width="600" height="270" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="600" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#5b21b6">JRE</text>
<text x="600" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#475569">Runtime environment for executing Java applications</text>
<rect x="430" y="465" width="340" height="100" rx="18" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
<text x="600" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#4c1d95">JVM</text>
<text x="600" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">Loads and executes bytecode</text>
<rect x="210" y="635" width="780" height="46" rx="16" fill="#e2e8f0"/>
<text x="600" y="666" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#334155">JDK = JRE + development tools such as compiler and debugger</text>
</svg>
