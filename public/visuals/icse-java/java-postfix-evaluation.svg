<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Postfix Expression Evaluation Using a Stack</title>
<desc id="desc">Evaluating the postfix expression 5 3 + 2 * with a stack: push each number, and when an operator is seen, pop two values, apply the operator, and push the result back.</desc>
<rect width="1200" height="460" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Postfix Evaluation: 5 3 + 2 *</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="130" y="95" font-size="20" font-weight="700" fill="#0f172a">token: 5</text>
<text x="130" y="120" font-size="13" fill="#334155">push 5</text>
<rect x="85" y="320" width="90" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="130" y="350" font-size="18" fill="#1e3a8a">5</text>
<line x1="80" y1="330" x2="180" y2="330" stroke="#334155" stroke-width="3"/>
<text x="370" y="95" font-size="20" font-weight="700" fill="#0f172a">token: 3</text>
<text x="370" y="120" font-size="13" fill="#334155">push 3</text>
<rect x="325" y="320" width="90" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="370" y="350" font-size="18" fill="#1e3a8a">5</text>
<rect x="325" y="265" width="90" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="370" y="295" font-size="18" fill="#1e3a8a">3</text>
<line x1="320" y1="330" x2="420" y2="330" stroke="#334155" stroke-width="3"/>
<text x="610" y="95" font-size="20" font-weight="700" fill="#0f172a">token: +</text>
<text x="610" y="120" font-size="13" fill="#334155">pop 3, pop 5, push 5+3</text>
<rect x="565" y="320" width="90" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="610" y="350" font-size="18" fill="#1e3a8a">8</text>
<line x1="560" y1="330" x2="660" y2="330" stroke="#334155" stroke-width="3"/>
<text x="850" y="95" font-size="20" font-weight="700" fill="#0f172a">token: 2</text>
<text x="850" y="120" font-size="13" fill="#334155">push 2</text>
<rect x="805" y="320" width="90" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="850" y="350" font-size="18" fill="#1e3a8a">8</text>
<rect x="805" y="265" width="90" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="850" y="295" font-size="18" fill="#1e3a8a">2</text>
<line x1="800" y1="330" x2="900" y2="330" stroke="#334155" stroke-width="3"/>
<text x="1090" y="95" font-size="20" font-weight="700" fill="#0f172a">token: *</text>
<text x="1090" y="120" font-size="13" fill="#334155">pop 2, pop 8, push 8*2</text>
<rect x="1045" y="320" width="90" height="45" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="1090" y="350" font-size="18" fill="#1e3a8a">16</text>
<line x1="1040" y1="330" x2="1140" y2="330" stroke="#334155" stroke-width="3"/>
<rect x="500" y="390" width="200" height="55" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="600" y="425" font-size="18" fill="#14532d">Result: 16</text>
</g>
</svg>
