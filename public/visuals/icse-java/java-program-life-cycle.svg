<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Java Program Life Cycle</title>
<desc id="desc">Flowchart showing a Java source file compiled into bytecode and then executed by the JVM to produce output.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="520" rx="30" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Program Life Cycle</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="70" y="170" width="190" height="110" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="165" y="215" font-size="24" font-weight="700" fill="#1e3a8a">Write</text><text x="165" y="250" font-size="20" fill="#334155">Program.java</text>
<rect x="355" y="170" width="190" height="110" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="450" y="215" font-size="24" font-weight="700" fill="#166534">Compile</text><text x="450" y="250" font-size="20" fill="#334155">javac</text>
<rect x="640" y="170" width="190" height="110" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="735" y="215" font-size="24" font-weight="700" fill="#92400e">Bytecode</text><text x="735" y="250" font-size="20" fill="#334155">Program.class</text>
<rect x="925" y="170" width="190" height="110" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="1020" y="215" font-size="24" font-weight="700" fill="#5b21b6">Execute</text><text x="1020" y="250" font-size="20" fill="#334155">JVM</text>
<line x1="260" y1="225" x2="355" y2="225" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><line x1="545" y1="225" x2="640" y2="225" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><line x1="830" y1="225" x2="925" y2="225" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/>
<rect x="355" y="365" width="490" height="75" rx="18" fill="#e2e8f0"/><text x="600" y="410" font-size="22" font-weight="700" fill="#334155">Output appears on the screen</text>
<line x1="1020" y1="280" x2="1020" y2="335" stroke="#334155" stroke-width="5" marker-end="url(#arrow)"/><line x1="1020" y1="335" x2="845" y2="402" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
</g></svg>
