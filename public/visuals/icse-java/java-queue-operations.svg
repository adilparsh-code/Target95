<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Queue Operations: Enqueue and Dequeue</title>
<desc id="desc">A queue follows FIFO order. enqueue inserts at the rear; dequeue removes from the front, so the earliest inserted item leaves first.</desc>
<defs><marker id="qh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="400" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">Queue Operations (FIFO): enqueue and dequeue</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="600" y="105" font-size="17" fill="#334155">Trace: enqueue(X), enqueue(Y), dequeue() &#8594; X, enqueue(Z), dequeue() &#8594; Y</text>

<rect x="450" y="150" width="120" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="510" y="192" font-size="20" fill="#1e3a8a">Y</text>
<rect x="570" y="150" width="120" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="630" y="192" font-size="20" fill="#1e3a8a">Z</text>

<text x="510" y="140" font-size="14" fill="#334155">FRONT</text>
<text x="630" y="140" font-size="14" fill="#334155">REAR</text>

<path d="M300 185 L440 185" stroke="#dc2626" stroke-width="4" marker-end="url(#qh)"/>
<text x="370" y="170" font-size="14" fill="#7f1d1d">dequeue removes here</text>

<path d="M700 185 L840 185" stroke="#16a34a" stroke-width="4" marker-end="url(#qh)"/>
<text x="770" y="170" font-size="14" fill="#14532d">enqueue adds here</text>

<rect x="250" y="270" width="700" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="600" y="302" font-size="16" font-weight="700" fill="#78350f">enqueue(x): insert at rear    dequeue(): remove from front</text>
<text x="600" y="330" font-size="14" fill="#78350f">X was inserted first, so it is the first one removed (FIFO).</text>
</g>
</svg>
