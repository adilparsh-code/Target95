<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Java String Memory Concept</title>
<desc id="desc">String literals with the same text share one object in the string pool, while new String() always creates a separate object on the heap.</desc>
<defs><marker id="sh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="460" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java String Memory Concept</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="230" y="110" font-size="18" fill="#0f172a" text-anchor="start">String a = "cat";</text>
<text x="230" y="140" font-size="18" fill="#0f172a" text-anchor="start">String b = "cat";</text>
<text x="230" y="170" font-size="18" fill="#0f172a" text-anchor="start">String c = new String("cat");</text>

<rect x="120" y="100" width="60" height="30" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="150" y="121" font-size="14">a</text>
<rect x="120" y="130" width="60" height="30" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="150" y="151" font-size="14">b</text>
<rect x="120" y="160" width="60" height="30" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="150" y="181" font-size="14">c</text>

<path d="M180 115 L560 240" stroke="#2563eb" stroke-width="3" marker-end="url(#sh)"/>
<path d="M180 145 L560 240" stroke="#2563eb" stroke-width="3" marker-end="url(#sh)"/>
<path d="M180 175 L790 300" stroke="#d97706" stroke-width="3" marker-end="url(#sh)"/>

<rect x="450" y="240" width="220" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="560" y="275" font-size="18" font-weight="700" fill="#1e3a8a">String Pool</text>
<text x="560" y="305" font-size="18" fill="#1e3a8a">"cat"</text>
<text x="560" y="345" font-size="14" fill="#334155">a and b point to the SAME pooled object</text>

<rect x="680" y="300" width="220" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="790" y="335" font-size="18" font-weight="700" fill="#78350f">Heap</text>
<text x="790" y="365" font-size="18" fill="#78350f">"cat" (new object)</text>
<text x="790" y="410" font-size="14" fill="#334155">c points to its own separate object</text>

<text x="600" y="440" font-size="15" fill="#334155">a == b is true; a == c is false (different objects); a.equals(c) is true (same content).</text>
</g>
</svg>
