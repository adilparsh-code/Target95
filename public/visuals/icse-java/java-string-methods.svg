<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Common Java String Methods</title>
<desc id="desc">A reference of common String methods (length, charAt, substring, indexOf, toUpperCase, equals) applied to the string Java Rocks.</desc>
<rect width="1200" height="460" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Common Java String Methods</text>
<g font-family="Arial,sans-serif">
<text x="600" y="95" text-anchor="middle" font-size="18" fill="#334155">String s = "Java Rocks";</text>
<rect x="150" y="130" width="900" height="34" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
<text x="170" y="153" font-size="15" fill="#0f172a" font-family="monospace">s.length()</text>
<text x="620" y="153" font-size="15" fill="#166534" font-family="monospace">10</text>
<text x="770" y="153" font-size="14" fill="#334155">Number of characters</text>
<rect x="150" y="168" width="900" height="34" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/>
<text x="170" y="191" font-size="15" fill="#0f172a" font-family="monospace">s.charAt(0)</text>
<text x="620" y="191" font-size="15" fill="#166534" font-family="monospace">'J'</text>
<text x="770" y="191" font-size="14" fill="#334155">Character at index 0</text>
<rect x="150" y="206" width="900" height="34" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
<text x="170" y="229" font-size="15" fill="#0f172a" font-family="monospace">s.substring(5)</text>
<text x="620" y="229" font-size="15" fill="#166534" font-family="monospace">"Rocks"</text>
<text x="770" y="229" font-size="14" fill="#334155">From index 5 to the end</text>
<rect x="150" y="244" width="900" height="34" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/>
<text x="170" y="267" font-size="15" fill="#0f172a" font-family="monospace">s.indexOf("Rocks")</text>
<text x="620" y="267" font-size="15" fill="#166534" font-family="monospace">5</text>
<text x="770" y="267" font-size="14" fill="#334155">Starting index of a substring</text>
<rect x="150" y="282" width="900" height="34" fill="#eff6ff" stroke="#94a3b8" stroke-width="1"/>
<text x="170" y="305" font-size="15" fill="#0f172a" font-family="monospace">s.toUpperCase()</text>
<text x="620" y="305" font-size="15" fill="#166534" font-family="monospace">"JAVA ROCKS"</text>
<text x="770" y="305" font-size="14" fill="#334155">All characters uppercase</text>
<rect x="150" y="320" width="900" height="34" fill="#dbeafe" stroke="#94a3b8" stroke-width="1"/>
<text x="170" y="343" font-size="15" fill="#0f172a" font-family="monospace">s.equals("Java Rocks")</text>
<text x="620" y="343" font-size="15" fill="#166534" font-family="monospace">true</text>
<text x="770" y="343" font-size="14" fill="#334155">Content equality check</text>
</g>
</svg>
