<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">String substring() and Immutability</title>
<desc id="desc">substring(start, end) returns characters from index start up to but not including end, as a new String; the original String object is never modified.</desc>
<rect width="1200" height="420" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">String substring() and Immutability</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="600" y="90" font-size="17" fill="#334155">String s = "COMPUTER"; s.substring(2, 6)</text>
<rect x="300" y="130" width="60" height="60" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
<text x="330" y="168" font-size="24" fill="#0f172a" text-anchor="middle">C</text>
<text x="330" y="205" font-size="12" fill="#64748b" text-anchor="middle">0</text>
<rect x="370" y="130" width="60" height="60" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
<text x="400" y="168" font-size="24" fill="#0f172a" text-anchor="middle">O</text>
<text x="400" y="205" font-size="12" fill="#64748b" text-anchor="middle">1</text>
<rect x="440" y="130" width="60" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="470" y="168" font-size="24" fill="#0f172a" text-anchor="middle">M</text>
<text x="470" y="205" font-size="12" fill="#64748b" text-anchor="middle">2</text>
<rect x="510" y="130" width="60" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="540" y="168" font-size="24" fill="#0f172a" text-anchor="middle">P</text>
<text x="540" y="205" font-size="12" fill="#64748b" text-anchor="middle">3</text>
<rect x="580" y="130" width="60" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="610" y="168" font-size="24" fill="#0f172a" text-anchor="middle">U</text>
<text x="610" y="205" font-size="12" fill="#64748b" text-anchor="middle">4</text>
<rect x="650" y="130" width="60" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="680" y="168" font-size="24" fill="#0f172a" text-anchor="middle">T</text>
<text x="680" y="205" font-size="12" fill="#64748b" text-anchor="middle">5</text>
<rect x="720" y="130" width="60" height="60" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
<text x="750" y="168" font-size="24" fill="#0f172a" text-anchor="middle">E</text>
<text x="750" y="205" font-size="12" fill="#64748b" text-anchor="middle">6</text>
<rect x="790" y="130" width="60" height="60" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
<text x="820" y="168" font-size="24" fill="#0f172a" text-anchor="middle">R</text>
<text x="820" y="205" font-size="12" fill="#64748b" text-anchor="middle">7</text>
<text x="600" y="255" font-size="14" fill="#14532d">indices 2,3,4,5 included (start=2, end=6 is exclusive)</text>
<rect x="450" y="285" width="300" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="600" y="322" font-size="20" fill="#1e3a8a">Returns new String "MPUT"</text>
<text x="600" y="380" font-size="15" fill="#334155">The original s still equals "COMPUTER" - substring() never changes the original String object.</text>
</g>
</svg>
