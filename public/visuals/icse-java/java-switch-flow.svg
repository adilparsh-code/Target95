<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Java switch case flow</title><desc id="desc">A flowchart showing switch expression, case matching, execution and default.</desc><rect width="1200" height="700" rx="32" fill="#f8fafc"/><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Java switch–case Flow</text><g stroke="#334155" stroke-width="5" fill="none"><path d="M600 120 V175"/><path d="M600 325 V380"/><path d="M600 470 V525"/></g><rect x="430" y="95" width="340" height="80" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/><text x="600" y="145" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">switch(expression)</text><rect x="400" y="175" width="400" height="150" rx="24" fill="#fff" stroke="#6366f1" stroke-width="5"/><text x="600" y="215" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#312e81">Compare with cases</text><text x="600" y="255" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">case 1 • case 2 • case 3</text><text x="600" y="292" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">first matching case is selected</text><rect x="120" y="380" width="300" height="90" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="270" y="435" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#14532d">matching case</text><rect x="780" y="380" width="300" height="90" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="930" y="435" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#78350f">default</text><path d="M400 250 H270 V380" marker-end="url(#none)" stroke="#334155"/><path d="M800 250 H930 V380" stroke="#334155"/><text x="300" y="235" font-family="Arial" font-size="20" font-weight="700" fill="#15803d">match</text><text x="945" y="235" font-family="Arial" font-size="20" font-weight="700" fill="#b45309">no match</text><path d="M270 470 V525 H600"/><path d="M930 470 V525 H600"/><rect x="445" y="525" width="310" height="80" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/><text x="600" y="575" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#312e81">break → exit switch</text><text x="600" y="650" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">Without break, execution may continue into the next case.</text></svg>