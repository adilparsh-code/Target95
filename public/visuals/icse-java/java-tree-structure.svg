<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Binary Tree Structure and Inorder Traversal</title>
<desc id="desc">A binary tree with root 8, left child 3, and right child 10. Each node has at most two children. Inorder traversal (left, root, right) visits 3, 8, 10.</desc>
<rect width="1200" height="460" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">Binary Tree Structure</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<path d="M600 130 L400 250" stroke="#334155" stroke-width="4"/>
<path d="M600 130 L800 250" stroke="#334155" stroke-width="4"/>

<circle cx="600" cy="110" r="45" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="600" y="120" font-size="26" font-weight="700" fill="#1e3a8a">8</text>
<text x="600" y="70" font-size="14" fill="#334155">root</text>

<circle cx="400" cy="270" r="45" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="400" y="280" font-size="26" font-weight="700" fill="#78350f">3</text>
<text x="400" y="335" font-size="14" fill="#334155">left child</text>

<circle cx="800" cy="270" r="45" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="800" y="280" font-size="26" font-weight="700" fill="#14532d">10</text>
<text x="800" y="335" font-size="14" fill="#334155">right child</text>

<rect x="250" y="380" width="700" height="60" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
<text x="600" y="416" font-size="18" fill="#0f172a">Inorder (left, root, right): 3, 8, 10</text>
</g>
</svg>
