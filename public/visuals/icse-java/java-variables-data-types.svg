<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Java Variables and Data Types</title>
<desc id="desc">Java data types split into primitive types, which store values directly, and reference types, which store an address pointing to an object.</desc>
<rect width="1200" height="520" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java Variables and Data Types</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="500" y="90" width="200" height="55" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
<text x="600" y="124" font-size="18" fill="#0f172a">Data Types</text>
<path d="M560 145 L330 200" stroke="#334155" stroke-width="4"/>
<path d="M640 145 L870 200" stroke="#334155" stroke-width="4"/>

<rect x="140" y="200" width="380" height="270" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="330" y="235" font-size="22" font-weight="700" fill="#1e3a8a">Primitive Types</text>
<text x="330" y="265" font-size="16" fill="#1e3a8a">stores the value directly</text>
<text x="200" y="305" font-size="17" fill="#0f172a" text-anchor="start">byte, short, int, long</text>
<text x="200" y="335" font-size="17" fill="#0f172a" text-anchor="start">float, double</text>
<text x="200" y="365" font-size="17" fill="#0f172a" text-anchor="start">char</text>
<text x="200" y="395" font-size="17" fill="#0f172a" text-anchor="start">boolean</text>
<rect x="180" y="415" width="90" height="40" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="225" y="440" font-size="16" fill="#0f172a">int x = 5</text>

<rect x="680" y="200" width="380" height="270" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="870" y="235" font-size="22" font-weight="700" fill="#78350f">Reference Types</text>
<text x="870" y="265" font-size="16" fill="#78350f">stores an address to an object</text>
<text x="740" y="305" font-size="17" fill="#0f172a" text-anchor="start">String</text>
<text x="740" y="335" font-size="17" fill="#0f172a" text-anchor="start">Arrays</text>
<text x="740" y="365" font-size="17" fill="#0f172a" text-anchor="start">Classes / Objects</text>
<rect x="720" y="405" width="110" height="40" fill="#fff" stroke="#d97706" stroke-width="3"/>
<text x="775" y="430" font-size="15" fill="#0f172a">s (reference)</text>
<path d="M830 425 L920 425" stroke="#334155" stroke-width="3" marker-end="url(#gh)"/>
<rect x="920" y="405" width="120" height="40" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="980" y="430" font-size="14" fill="#14532d">"Hello" object</text>
</g>
<defs><marker id="gh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
</svg>
