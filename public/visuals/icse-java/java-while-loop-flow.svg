<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Java While Loop Execution Flow</title>
<desc id="desc">A while loop checks its condition before every iteration, so the body may never execute if the condition starts false.</desc>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="560" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Java WHILE Loop Execution Flow</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="470" y="95" width="260" height="60" rx="14" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
<text x="600" y="132" font-size="18" fill="#0f172a">Start / initialize</text>
<path d="M600 155 L600 195" stroke="#334155" stroke-width="5" marker-end="url(#ah)"/>

<path d="M600 195 L740 265 L600 335 L460 265 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
<text x="600" y="260" font-size="20" font-weight="700" fill="#1e3a8a">Condition</text>
<text x="600" y="283" font-size="16" fill="#1e3a8a">checked FIRST</text>

<path d="M600 335 L600 375" stroke="#334155" stroke-width="5" marker-end="url(#ah)"/>
<text x="640" y="360" font-size="16" fill="#166534" text-anchor="start">true</text>
<rect x="450" y="375" width="300" height="70" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="600" y="417" font-size="18" fill="#14532d">Execute loop body</text>

<path d="M450 410 L280 410 L280 265 L460 265" fill="none" stroke="#334155" stroke-width="4" marker-end="url(#ah)"/>
<text x="330" y="250" font-size="16" fill="#334155">repeat</text>

<path d="M740 265 L920 265" stroke="#334155" stroke-width="5" marker-end="url(#ah)"/>
<text x="820" y="248" font-size="16" fill="#7f1d1d">false</text>
<rect x="920" y="230" width="220" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
<text x="1030" y="272" font-size="18" fill="#7f1d1d">Exit loop</text>
</g>
</svg>
