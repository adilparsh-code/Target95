<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">Python List, Tuple and Dictionary</title>
<desc id="desc">Lists are mutable ordered sequences, tuples are immutable ordered sequences, and dictionaries map unique keys to values.</desc>
<rect width="1200" height="460" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">Python List, Tuple and Dictionary</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="60" y="100" width="330" height="230" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="225" y="135" font-size="20" font-weight="700" fill="#1e3a8a">list</text>
<text x="225" y="160" font-size="14" fill="#1e3a8a">mutable, ordered</text>
<text x="225" y="195" font-size="16" font-family="monospace" fill="#0f172a">marks = [88, 92, 76]</text>
<text x="225" y="225" font-size="14" fill="#334155">marks.append(95)</text>
<text x="225" y="250" font-size="14" fill="#334155">marks[0] = 90  # allowed</text>
<text x="225" y="285" font-size="13" fill="#334155">append, insert, remove,</text>
<text x="225" y="303" font-size="13" fill="#334155">pop, sort, reverse</text>

<rect x="435" y="100" width="330" height="230" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="600" y="135" font-size="20" font-weight="700" fill="#78350f">tuple</text>
<text x="600" y="160" font-size="14" fill="#78350f">immutable, ordered</text>
<text x="600" y="195" font-size="16" font-family="monospace" fill="#0f172a">point = (3, 4)</text>
<text x="600" y="225" font-size="14" fill="#7f1d1d">point[0] = 5  # error!</text>
<text x="600" y="250" font-size="13" fill="#334155">TypeError: 'tuple' object</text>
<text x="600" y="268" font-size="13" fill="#334155">does not support assignment</text>
<text x="600" y="300" font-size="13" fill="#334155">Use for fixed data (coordinates)</text>

<rect x="810" y="100" width="330" height="230" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="975" y="135" font-size="20" font-weight="700" fill="#14532d">dict</text>
<text x="975" y="160" font-size="14" fill="#14532d">key &#8594; value mapping</text>
<text x="975" y="195" font-size="15" font-family="monospace" fill="#0f172a">freq = &#123;"a": 3, "b": 1&#125;</text>
<text x="975" y="225" font-size="14" fill="#334155">freq.get("c", 0)  # 0</text>
<text x="975" y="250" font-size="13" fill="#334155">freq["a"] += 1</text>
<text x="975" y="285" font-size="13" fill="#334155">keys(), values(),</text>
<text x="975" y="303" font-size="13" fill="#334155">items(), get(key, default)</text>
</g>
</svg>
