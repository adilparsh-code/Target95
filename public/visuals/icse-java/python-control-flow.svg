<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Python if/elif/else and Loops</title>
<desc id="desc">Python if/elif/else evaluates branches top to bottom and runs only the first matching one. for iterates over a sequence; while repeats based on a condition. Indentation defines each block.</desc>
<defs><marker id="ph" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<rect width="1200" height="520" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Python Control Flow: if/elif/else and Loops</text>
<g font-family="Arial,sans-serif">
<rect x="60" y="90" width="500" height="200" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="90" y="125" font-size="18" font-weight="700" fill="#1e3a8a">if / elif / else</text>
<text x="90" y="160" font-size="15" font-family="monospace" fill="#0f172a">if marks &gt;= 90:</text>
<text x="90" y="185" font-size="15" font-family="monospace" fill="#0f172a">    grade = "A"</text>
<text x="90" y="210" font-size="15" font-family="monospace" fill="#0f172a">elif marks &gt;= 75:</text>
<text x="90" y="235" font-size="15" font-family="monospace" fill="#0f172a">    grade = "B"</text>
<text x="90" y="260" font-size="15" font-family="monospace" fill="#0f172a">else:</text>
<text x="90" y="285" font-size="14" font-family="monospace" fill="#78350f">    grade = "C"   # only first true branch runs</text>

<rect x="640" y="90" width="500" height="200" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
<text x="670" y="125" font-size="18" font-weight="700" fill="#78350f">for loop</text>
<text x="670" y="160" font-size="15" font-family="monospace" fill="#0f172a">total = 0</text>
<text x="670" y="185" font-size="15" font-family="monospace" fill="#0f172a">for i in range(1, 5):</text>
<text x="670" y="210" font-size="15" font-family="monospace" fill="#0f172a">    total += i</text>
<text x="670" y="245" font-size="14" fill="#334155">range(1,5) gives 1,2,3,4</text>
<text x="670" y="268" font-size="14" fill="#334155">total: 0&#8594;1&#8594;3&#8594;6&#8594;10</text>

<rect x="60" y="320" width="500" height="170" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
<text x="90" y="355" font-size="18" font-weight="700" fill="#14532d">while loop</text>
<text x="90" y="390" font-size="15" font-family="monospace" fill="#0f172a">n = 5</text>
<text x="90" y="415" font-size="15" font-family="monospace" fill="#0f172a">while n &gt; 0:</text>
<text x="90" y="440" font-size="15" font-family="monospace" fill="#0f172a">    print(n)</text>
<text x="90" y="465" font-size="15" font-family="monospace" fill="#0f172a">    n -= 1</text>

<rect x="640" y="320" width="500" height="170" rx="14" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
<text x="670" y="355" font-size="18" font-weight="700" fill="#0f172a">Indentation is the block</text>
<text x="670" y="390" font-size="14" fill="#334155">There are no braces { } in Python.</text>
<text x="670" y="415" font-size="14" fill="#334155">Every statement in a block must have the</text>
<text x="670" y="435" font-size="14" fill="#334155">same, consistent indentation, or Python</text>
<text x="670" y="455" font-size="14" fill="#7f1d1d">raises an IndentationError.</text>
</g>
</svg>
