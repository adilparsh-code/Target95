<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Python Variables and Data Types</title>
<desc id="desc">Python variables need no type declaration; the type is determined by the value assigned, covering int, float, str, bool and list.</desc>
<rect width="1200" height="480" rx="32" fill="#f8fafc"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">Python Variables and Data Types</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="600" y="95" font-size="16" fill="#334155">No type keyword needed — the type comes from the value assigned</text>
<rect x="200" y="130" width="420" height="55" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="220" y="165" font-size="17" fill="#1e3a8a" font-family="monospace" text-anchor="start">age = 15</text>
<rect x="660" y="130" width="140" height="55" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="730" y="165" font-size="17" fill="#0f172a">type: int</text>
<rect x="200" y="195" width="420" height="55" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
<text x="220" y="230" font-size="17" fill="#78350f" font-family="monospace" text-anchor="start">price = 49.99</text>
<rect x="660" y="195" width="140" height="55" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="730" y="230" font-size="17" fill="#0f172a">type: float</text>
<rect x="200" y="260" width="420" height="55" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
<text x="220" y="295" font-size="17" fill="#14532d" font-family="monospace" text-anchor="start">name = "Ana"</text>
<rect x="660" y="260" width="140" height="55" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="730" y="295" font-size="17" fill="#0f172a">type: str</text>
<rect x="200" y="325" width="420" height="55" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
<text x="220" y="360" font-size="17" fill="#7f1d1d" font-family="monospace" text-anchor="start">is_valid = True</text>
<rect x="660" y="325" width="140" height="55" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="730" y="360" font-size="17" fill="#0f172a">type: bool</text>
<rect x="200" y="390" width="420" height="55" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="220" y="425" font-size="17" fill="#4c1d95" font-family="monospace" text-anchor="start">marks = [88, 92, 76]</text>
<rect x="660" y="390" width="140" height="55" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="730" y="425" font-size="17" fill="#0f172a">type: list</text>
<text x="600" y="450" font-size="15" fill="#334155">Check a variable's type at any time with the built-in type() function, e.g. type(age) returns &lt;class 'int'&gt;.</text>
</g>
</svg>
